    <style>
        body { margin:0; background:#000; font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; color: #fff; overflow-x: hidden; }
        
        /* ===== LEGEND DOWN RIGHT (SMALL, HIGHER, WITH CLOSE BUTTON) ===== */
        .legend-container {
            position: fixed;
            bottom: 40px;
            right: 10px;
            z-index: 1000;
            background: rgba(0,0,0,0.85);
            border: 1px solid #333;
            border-radius: 8px;
            padding: 6px 8px;
            backdrop-filter: blur(5px);
            display: flex;
            flex-direction: column;
            gap: 4px;
            transition: opacity 0.3s ease, transform 0.3s ease;
            max-width: 140px;
        }

        .legend-close {
            position: absolute;
            top: -8px;
            right: -8px;
            width: 20px;
            height: 20px;
            background: #D4AF37;
            color: #000;
            border: none;
            border-radius: 50%;
            font-size: 14px;
            font-weight: bold;
            line-height: 20px;
            text-align: center;
            cursor: pointer;
            box-shadow: 0 0 6px rgba(212, 175, 55, 0.7);
            z-index: 1001;
            transition: 0.2s;
        }

        .legend-close:hover {
            transform: scale(1.1);
            background: #fff;
        }

        .legend-container.legend-hidden {
            opacity: 0;
            pointer-events: none;
            transform: scale(0.8) translateX(20px);
        }
        
        .legend-item {
            display: flex;
            align-items: center;
            gap: 6px;
            color: #ccc;
            font-size: 9px;
        }
        
        .legend-icon {
            width: 14px;
            height: 14px;
            flex-shrink: 0;
        }
        
        .legend-text {
            color: #fff;
            font-weight: 500;
            white-space: nowrap;
            font-size: 9px;
        }
        
        .legend-item.gold .legend-icon {
            filter: drop-shadow(0 0 3px #D4AF37);
        }
        .legend-item.gold .legend-text {
            color: #D4AF37;
        }
        
        .legend-item.purple .legend-icon {
            filter: drop-shadow(0 0 3px #b56cff);
        }
        .legend-item.purple .legend-text {
            color: #b56cff;
        }
        
        .legend-item.diamond .legend-icon {
            filter: drop-shadow(0 0 5px #fff);
            animation: diamondPulse 1.5s infinite ease-in-out;
        }
        .legend-item.diamond .legend-text {
            color: #fff;
        }
        
        @keyframes diamondPulse {
            0%, 100% { transform: scale(1); filter: drop-shadow(0 0 5px #fff); }
            50% { transform: scale(1.15); filter: drop-shadow(0 0 12px #fff); }
        }
        
        /* ===== TOP OWNED SECTION ===== */
        .top-owned-section { 
            padding: 10px 0; 
            background: #000; 
            border-bottom: 1px solid #1a1a1a;
            width: 100%;
        }
        
        .top-owned-section h2 { 
            color: #D4AF37; 
            text-align: center; 
            font-size: 14px; 
            margin: 0 0 10px 0;
            text-transform: uppercase;
            letter-spacing: 1px;
            animation: luxuryGlow 3s infinite ease-in-out;
            text-shadow: 0 0 6px #D4AF37, 0 0 10px #D4AF37;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
        }
        
        @keyframes luxuryGlow {
            0%, 100% {
                opacity: 1;
                text-shadow: 0 0 6px #D4AF37, 0 0 10px #D4AF37;
            }
            50% {
                opacity: 0.9;
                text-shadow: 0 0 4px #D4AF37, 0 0 7px #D4AF37;
            }
        }

        .title-icon {
            width: 18px;
            height: 18px;
            vertical-align: middle;
            margin: 0 6px;
            filter: drop-shadow(0 0 4px rgba(212, 175, 55, 0.6));
        }

        .title-icon-left {
            margin-right: 8px;
        }

        .title-icon-right {
            margin-left: 8px;
        }
        
        .owned-list { 
            display: flex; 
            overflow-x: auto; 
            gap: 12px; 
            padding: 0 15px 10px 15px;
            scrollbar-width: none;
            scroll-behavior: auto;
        }
        .owned-list::-webkit-scrollbar { display: none; }
        
        .owned-item {
            background: #0a0a0a;
            border: 1px solid #333;
            padding: 10px;
            border-radius: 10px;
            min-width: 140px;
            flex-shrink: 0;
            text-align: center;
            transition: 0.3s;
        }
        .owned-item:hover { border-color: #D4AF37; transform: translateY(-2px); }
        .owned-name { color: #fff; font-weight: bold; font-size: 13px; display: block; }
        .owned-owner { color: #D4AF37; font-size: 11px; display: block; margin-top: 4px; }
        .view-btn {
            background: transparent;
            color: #fff;
            border: 1px solid #444;
            padding: 4px 10px;
            border-radius: 12px;
            font-size: 10px;
            margin-top: 8px;
            cursor: pointer;
        }

        #map { height: 75vh; width: 100%; position: relative; }
        
        /* ===== SEARCH (موبايل: بالوسط | لابتوب: يسار الشاشة) ===== */
        .search {
            position: absolute;
            top: 10px;
            z-index: 1000;
            background: rgba(0,0,0,0.85);
            border: 1px solid #333;
            width: 80%;
            max-width: 320px;
            padding: 8px;
            border-radius: 10px;
            backdrop-filter: blur(5px);
            display: flex;
            align-items: center;
            gap: 8px;
        }

        /* موبايل: السيرش بالوسط */
        @media (max-width: 1024px) {
            .search {
                left: 50%;
                transform: translateX(-50%);
            }
        }

        /* لابتوب: السيرش على اليسار */
        @media (min-width: 1025px) {
            .search {
                left: 20px;
                right: auto;
                transform: none;
                width: 320px;
            }
        }

        .search-icon-wrapper {
            flex-shrink: 0;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .search-diamond-icon {
            width: 24px;
            height: 24px;
            animation: pulse 1.5s infinite ease-in-out;
            filter: brightness(1) drop-shadow(0 0 5px #fff);
        }

        .search input {
            flex: 1;
            background: transparent;
            color: #D4AF37;
            border: none;
            outline: none;
            font-size: 14px;
        }

        @keyframes pulse {
            0%, 100% { 
                transform: scale(1); 
                filter: brightness(1) drop-shadow(0 0 5px #fff); 
            }
            50% { 
                transform: scale(1.1); 
                filter: brightness(1.4) drop-shadow(0 0 15px #fff); 
            }
        }

        /* ICON STYLES */
        .star-icon { width: 16px; height: 16px; }
        .vip-glow { filter: drop-shadow(0 0 6px #b56cff); }
        .diamond-icon { width: 32px; height: 32px; animation: pulse 1.5s infinite ease-in-out; }
        
        /* MODAL */
        #orderModal {
            display: none;
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.9);
            z-index: 10000;
            align-items: center;
            justify-content: center;
        }
        .orderBox {
            background: #000;
            border: 2px solid #D4AF37;
            border-radius: 12px;
            width: 90%;
            max-width: 360px;
            max-height: 88vh;
            overflow-y: auto;
            padding: 14px 16px;
            color: #D4AF37;
            scrollbar-width: thin;
            scrollbar-color: #D4AF37 #111;
        }
        .orderBox input, .orderBox select, .orderBox textarea {
            width: 100%; padding: 7px 10px; background: #111; border: 1px solid #333;
            color: #fff; border-radius: 6px; margin-top: 5px; box-sizing: border-box;
            font-size: 13px;
        }
        .unlockSubmit { background: #D4AF37; color: #000; border: none; padding: 12px; border-radius: 6px; cursor: pointer; width: 48%; font-weight: bold; }
        .closeBtn { background: transparent; color: #D4AF37; border: 1px solid #D4AF37; padding: 12px; border-radius: 6px; cursor: pointer; width: 48%; }

        /* POPUP */
        .leaflet-popup-content-wrapper { background: #000 !important; border: 1px solid #333; color: #fff !important; }
        .leaflet-popup-tip { background: #000 !important; }
    </style>
</head>
<body>

    <!-- TOP OWNED SECTION -->
    <section class="top-owned-section">
        <h2>
            <img src="gold_star.png" alt="" class="title-icon title-icon-left">
            Top Owned Stars
            <img src="gold_star.png" alt="" class="title-icon title-icon-right">
        </h2>
        <div id="top-owned-list" class="owned-list">
            <!-- Dynamic items will be appended here by JS -->
        </div>
    </section>

    <!-- LEGEND DOWN RIGHT -->
    <div class="legend-container" id="legend">
        <button class="legend-close" id="legendClose" title="hide this">×</button>
        <div class="legend-item gold">
            <img src="gold_star.png" alt="Gold" class="legend-icon">
            <span class="legend-text">LUXURY STARS</span>
        </div>
        <div class="legend-item purple">

            <span class="legend-text">VIP LUXURY STARS</span>
        </div>
        <div class="legend-item diamond">
            <img src="lebanon_diamond.png" alt="Diamond" class="legend-icon">

    <!-- MAP + SEARCH -->
    <div id="map">

                <img src="purple_star.png" alt="" class="search-diamond-icon">

        </div>
    </div>

    <!-- ORDER MODAL -->
    <div id="orderModal">
        <div class="orderBox">
            <h2 style="text-align:center; margin-top:0;">Unlock Ownership</h2>
            <form id="form">
                <input type="hidden" name="access_key" value="20df6853-cf06-465f-8b72-e2a5d3d5ee9d">
                <input id="starName" name="star" readonly style="background:transparent; border:none; font-size:18px; font-weight:bold; color:#D4AF37; text-align:center; width:100%; text-align:center;">

                <label style="display:block; margin-top:15px; font-size:11px; color:#888;">DURATION</label>
                <select id="months" name="months">
                    <option value="1">1 Month</option>
                    <option value="2">2 Months</option>

                    <option value="12">12 Months (DISCOUNT)</option>
                </select>

                <label style="display:block; margin-top:10px; font-size:11px; color:#888;">TOTAL PRICE</label>
                <input id="totalPrice" readonly name="price" style="font-weight: bold; color: #fff;">

                <!-- SENDER INFO -->
                <div style="margin-top:10px; padding:8px; border:1px solid #222; border-radius:8px;">
                    <div style="font-size:10px; color:#888; margin-bottom:6px; letter-spacing:1px;">📤 SENDER INFO</div>

                <div style="margin-top:8px; padding:8px; border:1px solid #222; border-radius:8px;">

                    <div style="display:flex; align-items:center; gap:8px; margin-bottom:6px;">
                        <input type="checkbox" id="sameAsSender" onchange="toggleSameAsSender(this)" style="width:auto; margin:0; cursor:pointer;">
                        <label for="sameAsSender" style="font-size:11px; color:#aaa; cursor:pointer;">Same as sender (gift to myself)</label>
                    </div>
                    <input id="receiver_name" name="receiver_name" required placeholder="Receiver Full Name" style="margin-top:4px;">
                    <input id="receiver_phone" name="receiver_phone" required placeholder="Receiver Phone Number" type="tel" style="margin-top:8px;">
                </div>

                <!-- SOCIAL MEDIA -->
                <div style="margin-top:8px; padding:8px; border:1px solid #222; border-radius:8px;">
                    <div style="font-size:10px; color:#888; margin-bottom:2px; letter-spacing:1px;">🌐 SOCIAL MEDIA (RECEIVER)</div>
                    <div style="font-size:9px; color:#555; margin-bottom:6px;">At least one required</div>
                    <input id="social_instagram" name="receiver_instagram" placeholder="Instagram @username" style="margin-top:4px;">
                    <input id="social_tiktok" name="receiver_tiktok" placeholder="TikTok @username" style="margin-top:6px;">
                    <input id="social_snapchat" name="receiver_snapchat" placeholder="Snapchat @username" style="margin-top:6px;">
                </div>

                <div style="display: flex; justify-content: space-between; margin-top:20px;">
                    <button type="submit" class="unlockSubmit">SUBMIT</button>
                    <button type="button" class="closeBtn" onclick="closeOrder()">CANCEL</button>
                </div>
            </form>
        </div>
    </div>

    <script src="data.js"></script>
    <script src="app.js"></script>
    
    <!-- AUTO-SCROLL ANIMATION FOR TOP OWNED LIST -->
    <script>
        const ownedList = document.querySelector('.owned-list');
        let autoScroll = true;
        let scrollSpeed = 0.8;

        function autoScrollList() {
            if (!autoScroll) return;
            
            ownedList.scrollLeft += scrollSpeed;
            
            if (ownedList.scrollLeft >= (ownedList.scrollWidth - ownedList.clientWidth)) {
                ownedList.scrollLeft = 0;
            }
            
            requestAnimationFrame(autoScrollList);
        }

        window.addEventListener('load', () => {
            setTimeout(autoScrollList, 500);
        });

        ownedList.addEventListener('touchstart', () => { 
            autoScroll = false; 
        }, { passive: true });
        
        ownedList.addEventListener('mousedown', () => { 
            autoScroll = false; 
        });

        ownedList.addEventListener('touchend', () => { 
            setTimeout(() => { autoScroll = true; }, 3000); 
        });
        
        ownedList.addEventListener('mouseup', () => { 
            setTimeout(() => { autoScroll = true; }, 3000); 
        });
        
        ownedList.addEventListener('mouseleave', () => { 
            setTimeout(() => { autoScroll = true; }, 3000); 
        });
        
        ownedList.addEventListener('touchmove', (e) => {
        }, { passive: true });

        // ===== LEGEND SHOW / HIDE =====
        const legend = document.getElementById('legend');
        const legendClose = document.getElementById('legendClose');

        function hideLegend() {
            legend.classList.add('legend-hidden');
        }

        function showLegend() {
            legend.classList.remove('legend-hidden');
        }

        function toggleLegend() {
            legend.classList.toggle('legend-hidden');
        }

        legendClose.addEventListener('click', hideLegend);
    </script>
</body>
</html><script>
// ===== SAME AS SENDER TOGGLE =====
function toggleSameAsSender(checkbox) {
    const senderName = document.querySelector('input[name="sender_name"]').value;
    const senderPhone = document.querySelector('input[name="sender_phone"]').value;
    const receiverName = document.getElementById('receiver_name');
    const receiverPhone = document.getElementById('receiver_phone');

    if (checkbox.checked) {
        receiverName.value = senderName;
        receiverPhone.value = senderPhone;
        receiverName.readOnly = true;
        receiverPhone.readOnly = true;
        receiverName.style.opacity = '0.5';
        receiverPhone.style.opacity = '0.5';
    } else {
        receiverName.value = '';
        receiverPhone.value = '';
        receiverName.readOnly = false;
        receiverPhone.readOnly = false;
        receiverName.style.opacity = '1';
        receiverPhone.style.opacity = '1';
    }
}
</script>
