<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>#</title>

<link href="https://fonts.googleapis.com/css2?family=Great+Vibes&display=swap" rel="stylesheet">

<style>
body{
margin:0;
height:100vh;
display:flex;
justify-content:center;
align-items:center;
background:#000;
overflow:hidden;
}

.container{
position:relative;
width:200px;
height:200px;
display:flex;
justify-content:center;
align-items:center;
}

.logo{
width:120px;
z-index:2;
position:absolute;
}

.circle{
position:absolute;
width:170px;
height:170px;
border-radius:50%;
border:3px solid transparent;
border-top:3px solid #d4af37;
border-right:3px solid #d4af37;
animation:spin 1.2s linear infinite;
filter:drop-shadow(0 0 6px #d4af37);
}

.circle::after{
content:'';
position:absolute;
inset:8px;
border-radius:50%;
border:2px solid rgba(212,175,55,0.2);
}

@keyframes spin{
0%{transform:rotate(0deg);}
100%{transform:rotate(360deg);}
}
</style>
</head>

<body>

<div class="container">
<div class="circle"></div>
<img src="logo.webp" class="logo" alt="Logo">
</div>

<script>
setTimeout(() => {
window.location.href = "./";
}, 4000);
</script>

</body>
</html>
