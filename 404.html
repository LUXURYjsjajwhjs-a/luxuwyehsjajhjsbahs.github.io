<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>#</title>

<link href="https://fonts.googleapis.com/css2?family=Great+Vibes&display=swap" rel="stylesheet">

<style>
body{
margin:0;
height:100vh;
display:flex;
justify-content:center;
align-items:center;
background:#000;
overflow:hidden;
}

.container{
position:relative;
width:320px;
height:220px;
display:flex;
justify-content:center;
align-items:center;
}

.loading{
position:absolute;
top:130px;
font-family:'Great Vibes',cursive;
font-size:48px;
color:#d4af37;
letter-spacing:2px;
}

.logo{
position:absolute;
width:140px;
animation:slide 4s ease-in-out forwards;
z-index:2;
}

@keyframes slide{
0%{transform:translateX(0);}
25%{transform:translateX(90px);}
50%{transform:translateX(-90px);}
75%{transform:translateX(90px);}
100%{transform:translateX(0);}
}
</style>
</head>
<body>

<div class="container">
<img src="logo.webp" class="logo" alt="Logo">
<div class="loading">Loading</div>
</div>

<script>
setTimeout(() => {
window.location.href = "./";
}, 4000);
</script>

</body>
</html>
